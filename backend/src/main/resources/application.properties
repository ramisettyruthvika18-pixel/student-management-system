server.port=${PORT:8080}

# ---- MySQL (change username/password to match your machine) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Tables are created/updated automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- JWT ----
# Secret must be at least 32 characters. Change it for any real deployment.
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-something-long-and-random-123456}
app.jwt.expiration-ms=86400000

# ---- CORS (React dev server, Vercel deployments, wildcard patterns supported) ----
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173,http://localhost:3000,https://*.vercel.app}
